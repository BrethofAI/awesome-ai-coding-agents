name: build-and-validate

# Link rot is a fact about the outside world, not a defect in this repo, so it
# must never turn the build red. The daily job REPAIRS it: validate.py --heal
# rewrites llms_txt_status from what the URLs actually serve, build.py
# regenerates the README, and the result is committed back. A job only fails
# when a script genuinely breaks — which is worth an email.

on:
  pull_request:
    paths:
      - 'entries/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
  schedule:
    # Daily heal against the live web (founder 2026-10-13: automatic, nobody approves).
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      heal:
        description: 'Write corrected statuses back and commit them'
        type: boolean
        default: false

concurrency:
  # Two runs committing to main at once would race on the push.
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── PRs: build and report. Never writes, never fails on link rot. ────────
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml requests

      - name: Build README + llms.txt
        run: python3 scripts/build.py

      - name: Report generated-file drift (informational)
        run: |
          if git diff --quiet README.md llms.txt llms-full.txt; then
            echo "Generated files are in sync with entries/."
          else
            echo "::notice::README.md / llms.txt / llms-full.txt differ from entries/. No action needed — main regenerates on merge."
          fi

      - name: Report status drift (informational)
        run: python3 scripts/validate.py | tee -a "$GITHUB_STEP_SUMMARY"

  # ── push to main: regenerate the README so visitors see fresh output. ────
  regenerate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml requests

      - run: python3 scripts/build.py

      - name: Commit regenerated files
        run: |
          git config user.name  "BrethofAI"
          git config user.email "hello@brethof.ai"
          if git diff --quiet; then
            echo "No changes."
          else
            git add README.md llms.txt llms-full.txt
            git commit -m "chore: regenerate README and llms.txt from entries/"
            git push || {
              # Two merges seconds apart: main moved on while this ran. The newer
              # push starts its own run, which regenerates from the newer entries.
              git fetch -q origin main
              if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
                echo "main moved on during this run; its own run regenerates the files."
              else
                exit 1
              fi
            }
          fi

  # ── read-only check: a manual run without the heal box. ───────────────────
  # Until 2026-10-13 this was the daily job and healing waited for a human; the
  # statuses then sat stale for two weeks. Founder 2026-10-13: "LLMS.TXT have only
  # value for our size if it's done automatic". The schedule now runs `heal`, which
  # is safe to leave unattended: it only rewrites llms_txt_status, and only after
  # the .health.json streaks (2 clean fetches to promote, 3 failures to demote).
  monitor:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.heal != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml requests

      - name: Check llms_txt_status against live URLs
        run: |
          set -o pipefail
          python3 scripts/validate.py 2>&1 | tee check.log

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Daily llms.txt check (read-only)'
            echo
            echo '```'
            sed -n '/^=\{10,\}/,$p' check.log 2>/dev/null || echo "(no report — see the step log)"
            echo '```'
            echo
            echo 'To apply: Actions -> this workflow -> Run workflow -> tick **heal**.'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── heal: writes. Daily on the schedule, or when someone ticks the box. ───
  heal:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.heal == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml requests

      # No --force here on purpose: the consecutive-run streaks in .health.json
      # are what stop a single bad day from rewriting the list.
      - name: Reconcile llms_txt_status against live URLs
        run: |
          set -o pipefail
          python3 scripts/validate.py --heal 2>&1 | tee heal.log

      - name: Regenerate README from healed entries
        run: python3 scripts/build.py

      - name: Job summary
        if: always()
        run: |
          {
            echo '## llms.txt reconcile'
            echo
            echo '```'
            sed -n '/^=\{10,\}/,$p' heal.log 2>/dev/null || echo "(no report — see the step log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit healed statuses
        run: |
          git config user.name  "BrethofAI"
          git config user.email "hello@brethof.ai"
          rm -f heal.log
          git add -A entries .health.json README.md llms.txt llms-full.txt
          if git diff --quiet --cached; then
            echo "Nothing changed — every status already matches the live web."
            exit 0
          fi
          git commit \
            -m "chore: reconcile llms_txt_status with live URLs" \
            -m "Daily heal. Statuses are derived from what each URL actually serves; see .health.json for the consecutive-outcome streaks that gate each flip."
          git push
