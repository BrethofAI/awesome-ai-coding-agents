tagline: Proprietary model-agnostic coding agent (desktop app, CLI, editor and Chrome extensions, PR reviewer) where every file edit is a diff you approve and shell commands run in a per-OS sandbox.

description: |
  Atlarix, by NorahLabs, is a coding agent that works beside your editor rather
  than replacing it. The same agent ships as a desktop app for macOS, Windows
  and Linux, a terminal CLI (`atlarix`, which shares the app's sessions, keys
  and MCP servers), an extension for VS Code, Cursor, Kiro, Windsurf and
  VSCodium (Zed and JetBrains IDEs run it over the Agent Client Protocol), a
  Chrome extension that drives your own browser, a GitHub pull-request reviewer
  and a cloud agent that runs in GitHub Actions. It works in Explore, Plan,
  Build, Debug and Review modes, and can split a task across parallel
  sub-agents.

  File edits come back as diffs you accept hunk by hunk. Ordinary shell
  commands run on their own, inside a write-confining sandbox (Seatbelt on
  macOS, Landlock on Linux, Low Integrity Level on Windows) that keeps writes
  in your workspace, so a command can change project files without asking;
  only commands flagged as dangerous wait for approval. Interactive terminal
  tabs you drive yourself, the Chrome tools and computer use are outside that
  sandbox, as its docs say. It builds no index or
  embeddings; it searches the open folder with ripgrep when it needs to.

  Models: Atlarix Auto (picks a model per step), the managed Atlarix Core
  models, your own key for OpenAI, Anthropic, Google, DeepSeek, OpenRouter and
  others, or a local model through Ollama or LM Studio. Your own keys and local
  models are free. Free Auto, for accounts with no credit, sends prompts to
  providers that may use them for training; the app asks before the first use.
  Core models are paid through Pro or pay-as-you-go credit
  ([pricing](https://atlarix.dev/pricing)); the cloud agent (from Slack or
  the web) runs on paid Atlarix models and uses your own GitHub Actions
  minutes. Every surface, the CLI included, signs in to a free Atlarix
  account. It is closed source. Installers and release notes are published in a public
  [releases repo](https://github.com/AmariahAK/atlarix-releases). Product
  analytics (PostHog) are opt-in.

features:
  - Desktop app (macOS, Windows, Linux), terminal CLI and editor extension sharing one agent
  - File edits shown as diffs and approved hunk by hunk
  - Shell commands run automatically in a per-OS write-confining sandbox; dangerous ones ask first
  - Any model, including your own API key or a local model via Ollama or LM Studio
  - Parallel sub-agents; Explore, Plan, Build, Debug and Review modes
  - Chrome extension that tests your running app in your own browser
  - GitHub pull-request reviewer and a GitHub Actions cloud agent
  - MCP servers from the official MCP Registry

use_cases:
  - Developers who want an agent beside their existing editor, with approval on every file edit
  - Working on local models or your own API keys without a subscription
  - Teams that want the same agent on desktop, terminal, CI and PR review

