tagline: Terminal coding agent that reads your project, edits files, runs your tests and shows the diff, on any of 276 coding models from one plan.

description: |
  Imagera Code is a coding agent for the terminal, installed with
  `npm i -g imagera-code` (or a one-line installer that needs no Node.js).
  You describe the change; it reads the project, edits the files, runs your
  tests and shows you the diff before you keep it.

  One plan covers 276 coding models from many labs. Each plan has one weekly
  limit and no short 3-hour lockouts; when the limit is reached you can keep
  going on credits instead of waiting. Plans are paid, from Pro to Max 50x
  ([pricing](https://imagera.ai/code)). The CLI package is MIT-licensed on
  npm; the models run through Imagera's hosted endpoint.

features:
  - Terminal agent that reads the project, edits files, runs tests and shows the diff
  - 276 coding models on one plan
  - One weekly limit, no short 3-hour lockouts
  - Keep going on credits when a limit is reached
  - Builds for macOS, Linux and Windows (arm64 and x64)

