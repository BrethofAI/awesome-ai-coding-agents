tagline: A terminal for macOS, Windows and Linux with a team of AI coding agents and configurable approvals, plus a VS Code extension.

description: |
  Mel is a terminal for macOS, Windows and Linux with a team of AI coding
  agents: you describe the work and the agents plan it, write the code, test
  it and get it ready to ship, while you watch each step in the terminal.
  Approvals are configurable, so you choose which edits and commands run on
  their own and which wait for your OK. A VS Code extension brings the same
  agents into the editor.

  The terminal is a free download with no account needed, and the agent is
  free on your own provider key. Paid Pro, Max and Business plans add Mel's
  hosted-AI credits ([pricing](https://www.openmel.dev/pricing)). Mel is
  proprietary (Thinkverse AI LLC).

features:
  - Terminal for macOS, Windows and Linux with a built-in team of AI coding agents
  - Agents plan, write, test and get code ready to ship
  - Configurable approvals for edits and commands
  - VS Code extension with the same agent team
  - Free terminal, and the agent free on your own provider key

